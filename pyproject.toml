[project]
name = "cargo-bot"
version = "0.1.0"
description = "A Telegram cargo management bot, built incrementally."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.7",
    "python-telegram-bot>=22.8",
]

[project.scripts]
telegram-cargo-bot = "cargo_bot.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
